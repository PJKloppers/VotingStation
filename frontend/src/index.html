<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Token voting for organizations. Issue PINs, open one question at a time, publish the count." />
    <meta name="color-scheme" content="light dark" />
    <!-- the status bar above the app. teal in light, where the page below it is
         white paper and the band reads as the brand; the dark page's own
         background in dark, where a lit teal strip would be the only bright
         thing on the screen in a darkened hall. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1e5f74" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161b" />
    <title>VotingStation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e5f74'/%3E%3Cpath d='M8 16.5l5.5 5.5L24 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- relative, like every other reference here, so the same build installs
         from the domain root and from the /VotingStation/ prefix Pages uses. -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS reads none of the manifest. these four are the whole of it there. -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="VotingStation" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent": translucent puts the page under the
         status bar, and nothing in app.css pads for a notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
