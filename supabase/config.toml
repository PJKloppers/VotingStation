# Minimal config so `supabase link` and `supabase db push` find this project.
project_id = "ukkgodlkxoyilyagtttj"

[db]
major_version = 17

# The organizer-facing letters. The HTML is in supabase/templates/; these
# entries only give each file its subject and say which template it is.
#
# Careful with `supabase config push`: it sends the WHOLE auth config, not the
# part written here. Anything this file leaves unsaid -- the providers, the
# redirect URLs, the site URL -- is pushed as its default and overwrites what
# the project actually has. Until this file mirrors the project, install these
# by pasting them into the dashboard under Authentication -> Emails.
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Set a new password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You have been invited to VotingStation"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your confirmation code"
content_path = "./supabase/templates/reauthentication.html"
